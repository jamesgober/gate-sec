# =============================================================================
#  R E P S   ·   gate-sec
# =============================================================================
[package]
name    = "gate-sec"
version = "0.1.0"

# Minimum Supported Rust Version (MSRV)
rust-version = "1.85"
edition = "2024"

# License
license = "Apache-2.0 OR MIT"

# Readme
readme = "README.md"

# Description
description = "Authorization for Rust services: deny-by-default permissions, roles and attribute rules, object-level checks, step-up requirements, and audited decisions."

# Keywords (5 max)
keywords = ["authorization", "permissions", "rbac", "abac", "security"]

# Categories
categories = ["authentication"]

# Links
homepage      = "https://github.com/jamesgober/gate-sec"
repository    = "https://github.com/jamesgober/gate-sec"
documentation = "https://docs.rs/gate-sec"

# Authors
authors = ["James Gober <me@jamesgober.com>"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "gate_sec"
path = "src/lib.rs"


# FEATURE FLAGS
# #################################
[features]
default = []


# DEPENDENCIES
# #################################
[dependencies]
# None yet. Planned dependencies and the reason for each are listed in
# dev/PLAN.md; each is added with the first code that needs it.


# DEV DEPENDENCIES
# #################################
[dev-dependencies]


# RELEASE PROFILE
# #################################
[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
panic         = "abort"
strip         = "symbols"
